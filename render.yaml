services:
  - type: web
    name: wwf-procureflow
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # Free tier does not support preDeployCommand, so we push schema + seed
    # as part of the build (DATABASE_URL is available at build time on Render).
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss --skip-generate && npx tsx prisma/seed.ts && npx next build
    startCommand: npm run start
    healthCheckPath: /demo
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: tsc_session
      - key: APP_NAME
        value: TSC ProcureFlow
      - key: NODE_ENV
        value: production
